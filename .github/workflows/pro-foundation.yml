name: Professional foundation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: behtan_pro_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres -d behtan_pro_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run test:pro:ux
      - run: npm run test:member:intake
      - run: npm run test:engine:safety
      - run: npm run test:landing
      - run: node --experimental-strip-types scripts/member-redesign.test.mjs
      - run: node --experimental-strip-types scripts/member-dialog-scroll.test.mjs
      - run: node --experimental-strip-types scripts/member-meal-confirmation.test.mjs
      - run: node --experimental-strip-types scripts/onboarding-experience.test.mjs
      - run: npm run test:onboarding:lifecycle
      - run: node --experimental-strip-types scripts/food-scan.test.mjs
      - run: node --experimental-strip-types scripts/member-meal-rotation.test.mjs
      - run: node scripts/food-scan-edge.test.mjs
      - run: npm run test:pro
      - run: node --experimental-strip-types scripts/allergen-safety.test.mjs
      - run: npm run test:pro:profile
      - run: npm run test:pro:native
        env:
          PRO_TEST_DATABASE_URL: postgres://postgres:synthetic-ci-only@localhost:5432/behtan_pro_test
          BEHTAN_MARKET_TEST: "true"
      - name: Start synthetic PostgREST
        env:
          PRO_TEST_DATABASE_URL: postgres://postgres:synthetic-ci-only@localhost:5432/behtan_pro_test
        run: |
          node scripts/member-postgrest-setup.mjs
          docker run -d --name behtan-postgrest-test --network host \
            -e PGRST_DB_URI=postgres://authenticator:synthetic-postgrest-only@127.0.0.1:5432/behtan_pro_test \
            -e PGRST_DB_SCHEMAS=public -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_SERVER_PORT=54321 \
            -e PGRST_JWT_SECRET=synthetic-postgrest-test-secret-32-characters-minimum \
            postgrest/postgrest:v14.18
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:54321/ >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs behtan-postgrest-test
          exit 1
      - name: Restore and verify synthetic PostgreSQL backup
        env:
          PRO_CONTAINER: ${{ job.services.postgres.id }}
          PRO_TEST_DATABASE_URL: postgres://postgres:synthetic-ci-only@localhost:5432/behtan_pro_test
          PRO_RESTORE_DATABASE_URL: postgres://postgres:synthetic-ci-only@localhost:5432/behtan_pro_restore_test
        run: |
          docker exec "$PRO_CONTAINER" pg_dump -U postgres -Fc behtan_pro_test > /tmp/behtan-pro-ci.dump
          docker exec "$PRO_CONTAINER" createdb -U postgres behtan_pro_restore_test
          # Keep public: this dump does not recreate PostgreSQL's default schema.
          docker exec -i "$PRO_CONTAINER" pg_restore -U postgres --dbname=behtan_pro_restore_test --exit-on-error < /tmp/behtan-pro-ci.dump
          npm run test:pro:recovery
      - run: npm run build && npm run build:admin && VITE_PRO_SANDBOX_ENABLED=true npm run build:pro
      - run: npx playwright install --with-deps chromium
      - name: Real PostgreSQL/PostgREST multi-context intake checks
        env:
          PRO_TEST_DATABASE_URL: postgres://postgres:synthetic-ci-only@localhost:5432/behtan_pro_test
        run: npx playwright test --config playwright.member-intake.config.ts
      - name: Pro browser checks
        run: npm run test:pro:browser
      - name: Admin browser checks
        run: npm run test:pro:admin:browser
      - name: Public browser checks
        run: npm run test:public:browser
      - name: Preserve browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve failed browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - run: node --experimental-strip-types scripts/member-authoritative-meals.test.mjs
      - run: npm run test:market
      - run: npm run test:security:hardening
      - run: npm run test:production && npm run test:admin && npm run test:medical-safety && npm run test:nutrition && npm run test:meal-progress && npm run test:onboarding && npm run test:routing && npm run test:mobile-meals && npm run test:diagnostics && npm run test:feasibility && npm run test:protein && npm run test:progress
