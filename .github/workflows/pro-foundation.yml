name: Professional foundation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: behtan_pro_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres -d behtan_pro_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run test:pro
      - run: npm run test:pro:native
        env:
          PRO_TEST_DATABASE_URL: postgres://postgres:synthetic-ci-only@localhost:5432/behtan_pro_test
      - name: Restore and verify synthetic PostgreSQL backup
        env:
          PRO_CONTAINER: ${{ job.services.postgres.id }}
          PRO_TEST_DATABASE_URL: postgres://postgres:synthetic-ci-only@localhost:5432/behtan_pro_test
          PRO_RESTORE_DATABASE_URL: postgres://postgres:synthetic-ci-only@localhost:5432/behtan_pro_restore_test
        run: |
          docker exec "$PRO_CONTAINER" pg_dump -U postgres -Fc behtan_pro_test > /tmp/behtan-pro-ci.dump
          docker exec "$PRO_CONTAINER" createdb -U postgres behtan_pro_restore_test
          # Keep public: this dump does not recreate PostgreSQL's default schema.
          docker exec -i "$PRO_CONTAINER" pg_restore -U postgres --dbname=behtan_pro_restore_test --exit-on-error < /tmp/behtan-pro-ci.dump
          npm run test:pro:recovery
      - run: npm run build && npm run build:admin && VITE_PRO_SANDBOX_ENABLED=true npm run build:pro
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pro:browser && npm run test:pro:admin:browser
      - run: npm run test:production && npm run test:admin && npm run test:medical-safety && npm run test:nutrition && npm run test:meal-progress && npm run test:onboarding && npm run test:routing && npm run test:mobile-meals && npm run test:diagnostics && npm run test:feasibility && npm run test:protein && npm run test:progress
