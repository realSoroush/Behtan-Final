name: Professional foundation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: behtan_pro_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run test:pro
      - run: npm run test:pro:native
        env:
          PRO_TEST_DATABASE_URL: postgres://postgres:synthetic-ci-only@localhost:5432/behtan_pro_test
      - run: npm run build && npm run build:admin && npm run build:pro
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pro:browser
      - run: npm run test:production && npm run test:admin && npm run test:medical-safety && npm run test:nutrition && npm run test:meal-progress && npm run test:onboarding && npm run test:routing && npm run test:mobile-meals && npm run test:diagnostics && npm run test:protein && npm run test:progress
